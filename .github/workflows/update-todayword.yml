name: 오늘의 말씀 자동 갱신

on:
  schedule:
    # 15:00 UTC = 00:00 KST
    - cron: '0 15 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 가톨릭굿뉴스에서 오늘의 말씀 가져와 반영
        run: node .github/scripts/update-todayword.js

      - name: 변경 사항 커밋 & 푸시
        run: |
          if git diff --quiet -- 성당홈페이지.html; then
            echo "No change, skipping commit."
            exit 0
          fi
          git config user.name "todayword-bot"
          git config user.email "actions@users.noreply.github.com"
          git add 성당홈페이지.html
          git commit -m "오늘의 말씀 자동 갱신: $(date -u -d '+9 hours' +'%Y.%m.%d')

          자동화된 커밋입니다 (매일 00:00 KST, GitHub Actions)"
          git push
